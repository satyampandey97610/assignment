services:
  db:
    image: pgvector/pgvector:pg16
    container_name: care_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: care
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d care"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: care_app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/care
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/care_test
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODE: ${LLM_MODE:-replay}
      EMBED_MODEL: ${EMBED_MODEL:-intfloat/multilingual-e5-small}
      SIM_THRESHOLD: ${SIM_THRESHOLD:-0.80}
      SAFETY_TIMEOUT_S: ${SAFETY_TIMEOUT_S:-4.0}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-20.0}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-5000}
      TOOL_CALL_CAP: ${TOOL_CALL_CAP:-4}
      SAFETY_REGEX_UNION: ${SAFETY_REGEX_UNION:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - .:/app
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             python -m app.retrieval.ingest &&
             uvicorn app.api.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
